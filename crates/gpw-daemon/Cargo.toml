[package]
name = "gpw-daemon"
description = "Areko GPUPinWatch service: measuring loop, throttling via NVML, shutdown, IPC server"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

[[bin]]
name = "areko-gpupinwatchd"
path = "src/main.rs"

# crate-specific dependencies go here (not into the workspace root)
[dependencies]
gpw-core.workspace = true
gpw-sources.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
nvml-wrapper = "0.13"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
] }

[build-dependencies]
embed-resource = "3"
