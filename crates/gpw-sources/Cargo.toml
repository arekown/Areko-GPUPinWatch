[package]
name = "gpw-sources"
description = "Areko GPUPinWatch device access: ASUS IT8915FN (i2c-dev / NVAPI), WireView Pro II (serial), MSI Ai-TS PSU (HID)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

# crate-specific dependencies go here (not into the workspace root)
[dependencies]
gpw-core.workspace = true
thiserror.workspace = true
# serial port for the WireView (both OS); no libudev, Linux discovery reads /sys directly
serialport = { version = "4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
] }
