<!doctype html>
<html lang="de" data-theme="areko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Areko GPUPinWatch</title>
<link href="style.css" rel="stylesheet">
</head>
<body>

<div class="win">
  <div class="bar">
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="9" width="24" height="14" rx="2"/>
        <path d="M12 9V5h8v4"/><circle cx="10" cy="16" r="2"/><circle cx="16" cy="16" r="2"/><circle cx="22" cy="16" r="2"/><path d="M16 23v5"/></svg>
      <div><h1><span class="brand">Areko</span> GPUPinWatch</h1><small data-t="appSub"></small></div>
    </div>
    <span class="pill off" id="pill"><i></i><span id="pillT"></span></span>
    <span class="svc" id="svc"></span>
  </div>
  <div class="tabs" id="tabs">
    <button data-p="ov" class="on" data-t="tabOv"></button>
    <button data-p="set" data-t="tabSet"></button>
    <button data-p="ev" data-t="tabEv"></button>
    <button data-p="info" data-t="tabInfo"></button>
  </div>

  <div class="page on" id="p-ov">
    <div class="cards" id="cards"></div>
    <div class="foot"><span id="lastRead"></span><span>12V-2x6 · 9,2 A / Pin</span></div>
  </div>

  <div class="page" id="p-set">
    <div class="grid2">
      <div class="box">
        <h3><i style="background:var(--warn)"></i><span data-t="stage1"></span></h3>
        <div class="row"><label data-t="from"></label><input type="range" min="7" max="9.2" step="0.1" value="8.5" id="warn"><span class="val" id="warnV"></span></div>
        <div class="row"><label data-t="for"></label><select id="hold1"></select></div>
        <div class="row"><label data-t="to"></label><select id="target"></select></div>
      </div>
      <div class="box">
        <h3><i style="background:var(--bad)"></i><span data-t="stage2"></span></h3>
        <div class="row"><label data-t="from"></label><input type="range" min="8.5" max="10" step="0.1" value="9.2" id="crit"><span class="val" id="critV"></span></div>
        <div class="row"><label data-t="for"></label><select id="hold2"></select></div>
        <div class="row"><label data-t="action"></label><select id="actSel"></select></div>
      </div>
      <div class="box">
        <h3 data-t="alerts"></h3>
        <div class="row"><label data-t="desk"></label><span class="sw" id="swDesk"></span></div>
        <div class="row"><label data-t="sound"></label><span class="sw" id="swSound"></span></div>
        <div class="row"><label data-t="auto"></label><span class="sw" id="swAuto"></span></div>
        <div class="row"><label data-t="rate"></label><select id="rate"></select></div>
        <div class="row"><label data-t="theme"></label><select id="themeSel"></select></div>
        <div class="row"><label data-t="language"></label><select id="langSel"></select></div>
      </div>
      <div class="box">
        <h3 data-t="sources"></h3>
        <div id="devs"></div>
      </div>
    </div>
  </div>

  <div class="page" id="p-ev"><div class="box"><table class="ev" id="evt"></table></div></div>

  <div class="page" id="p-info">
    <div class="grid2">
      <div class="box about">
        <h3><span class="brand">Areko</span>&nbsp;GPUPinWatch</h3>
        <div class="row"><label data-t="version"></label><span class="val">0.1.0</span></div>
        <div class="row"><label data-t="author"></label><span class="val">Areko</span></div>
        <div class="row"><label data-t="repo"></label><a class="val" href="https://github.com/arekown/Areko-GPUPinWatch" target="_blank" rel="noopener">github.com/arekown/Areko-GPUPinWatch</a></div>
        <div class="row"><label data-t="license"></label><span class="val">PolyForm Noncommercial 1.0.0</span></div>
        <p class="note" data-t="licenseTxt"></p>
      </div>
      <div class="box about">
        <h3 data-t="credits"></h3>
        <p class="note" data-t="creditsTxt"></p>
        <p class="cred">vhpwr-guard · LACT · LibreHardwareMonitor · PinSentinel · wireview-pro-ii · wireview-monitor · meltalarm · psutop · msi-psu-monitor</p>
        <p class="note warn" data-t="disclaimer"></p>
      </div>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
